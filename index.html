<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1220">
<title>Semilla</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Semilla">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--bg:#0a1220;--card:#111c2e;--line:#22304a;--tx:#fff;--mu:#8ea2c4;--gr:#2ed38a;--gr2:#17a068;--rd:#ff6b7d;--bl:#5b8def;--r:20px}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{font-family:"Segoe UI",system-ui,Roboto,sans-serif;color:var(--tx);min-height:100vh;
background:radial-gradient(1100px 500px at 50% -10%,#14284a 0,transparent 70%),var(--bg);
padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(96px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:980px;margin:0 auto}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--gr);outline-offset:2px}
header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--gr),var(--gr2));display:grid;place-items:center;font-weight:900;font-size:22px;color:#06301f}
header h1{font-size:19px}header p{font-size:12.5px;color:var(--mu)}
.sp{flex:1}
.ib{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.hero{background:linear-gradient(135deg,#143a33,#10243a 70%);border-color:#1f5a4b;padding:20px}
.hero small{font-size:13px;color:#cfe9df}
.top{display:grid;gap:12px}
.debt{background:linear-gradient(135deg,#17304f,#10243a 70%);border-color:#2a4b7a}
.debt .big{color:#9ec2ff}
.big{font-size:clamp(34px,8vw,48px);font-weight:900;margin:8px 0 16px;letter-spacing:-.5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini{background:#ffffff0d;border:1px solid #ffffff1f;border-radius:14px;padding:12px}
.mini small{display:block;font-size:12.5px;color:#d5e6df;margin-bottom:4px}
.mini b{font-size:clamp(15px,4vw,19px)}
.in{color:var(--gr)}.out{color:var(--rd)}
h2{font-size:13px;letter-spacing:.06em;color:var(--mu);margin:24px 2px 10px;display:flex;align-items:center}
h2 button{margin-left:auto;color:var(--gr);font-weight:700;font-size:13px;letter-spacing:0}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.act{display:flex;align-items:center;gap:12px;font-weight:700;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:14px}
.act i{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-style:normal;font-size:22px}
.act.a i{background:#12402f;color:var(--gr)}.act.b i{background:#4a2330;color:var(--rd)}
.grid{display:grid;gap:12px}
.goal b{font-size:15px}
.gh{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--mu);align-items:baseline}
.bar{height:9px;border-radius:9px;background:#26354f;margin:10px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--gr2),#7ff0b8);transition:width .6s}
.gf{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mu)}
.gb{display:flex;gap:8px;margin-top:12px}
.btn{padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:#16233a;font-weight:600;font-size:13.5px}
.btn.p{background:linear-gradient(135deg,var(--gr),var(--gr2));color:#06301f;border:0;font-weight:800}
.btn.d{color:var(--rd)}
.empty{text-align:center;color:var(--mu);padding:22px;font-size:14px;border:1px dashed var(--line);border-radius:var(--r)}
.donut{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center}
.donut svg{width:150px;height:150px;flex:none}
.lg{flex:1;min-width:150px;display:grid;gap:7px;font-size:13px}
.lg div{display:flex;align-items:center;gap:8px}.lg s{width:10px;height:10px;border-radius:3px;flex:none}.lg span{margin-left:auto;color:var(--mu)}
.days{display:flex;align-items:flex-end;justify-content:space-between;gap:6px;height:140px}
.days div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;font-size:11px;color:var(--mu)}
.days u{display:flex;align-items:flex-end;gap:3px;height:100%;width:100%;justify-content:center;text-decoration:none}
.days u i{width:42%;max-width:16px;border-radius:5px 5px 2px 2px;min-height:2px}
.mv{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #1b2a43}
.mv:last-child{border:0}
.mv .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;font-weight:800}
.mv .t{flex:1;min-width:0}.mv .t b{display:block;font-size:14.5px}.mv .t small{color:var(--mu);font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mv .am{font-weight:800;font-size:14.5px;white-space:nowrap}
.mv .x{color:var(--mu);width:30px;height:30px}
label{display:block;font-size:12.5px;color:var(--mu);margin:14px 0 6px}
input,select{width:100%;background:#0c1626;border:1px solid var(--line);border-radius:12px;padding:12px 13px;font-size:16px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#0c1626;border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{padding:11px;border-radius:10px;font-weight:700;color:var(--mu)}
.seg button.on.i{background:#12402f;color:var(--gr)}.seg button.on.g{background:#4a2330;color:var(--rd)}.seg button.on.t{background:#1b3a66;color:#fff}
.amt{font-size:30px!important;font-weight:800;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#16233a;border:1px solid var(--line);border-radius:30px;padding:7px 8px 7px 13px;font-size:13.5px}
.chip button{color:var(--mu);width:22px;height:22px;border-radius:50%;font-size:15px}
.row{display:flex;gap:8px}.row input{flex:1}
nav{position:fixed;left:0;right:0;bottom:0;background:#0a1220f2;backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav div{max-width:980px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mu);font-size:11.5px;padding:6px}
nav button span{font-size:20px;line-height:1}
nav button.on{color:var(--gr);font-weight:700}
dialog{border:1px solid var(--line);border-radius:22px;background:var(--card);color:var(--tx);padding:20px;width:min(92vw,400px);margin:auto}
dialog::backdrop{background:#000a}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#1b3a30;border:1px solid #2a6b52;padding:11px 18px;border-radius:30px;font-size:14px;opacity:0;transition:.3s;z-index:9;pointer-events:none}
#toast.s{opacity:1;transform:translate(-50%,0)}
@media(min-width:760px){.top{grid-template-columns:1fr 1fr}body{padding-top:30px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.gg{grid-template-columns:1fr 1fr}.cols>.card{height:100%}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><svg viewBox="120 104 290 350" width="26" height="30" aria-hidden="true"><path d="M256 395 C256 335 256 285 256 232" fill="none" stroke="#06301f" stroke-width="26" stroke-linecap="round"/><path d="M256 300 C196 312 146 276 136 204 C206 198 252 232 256 300Z" fill="#06301f"/><path d="M256 252 C260 176 312 124 392 120 C396 196 344 256 256 252Z" fill="#06301f"/><path d="M170 412 Q256 356 342 412 Q256 446 170 412Z" fill="#06301f"/></svg></div>
    <div><h1>SEMILLA</h1><p>El dinero crece con cada aporte.</p></div>
    <div class="sp"></div>
    <button class="ib" onclick="go('set')" aria-label="Ajustes">⚙</button>
  </header>
  <main id="v"></main>
</div>
<nav><div id="nav"></div></nav>
<dialog id="dlg"><form id="df"></form></dialog>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const COL=['#2ed38a','#5b8def','#f5b942','#ff6b7d','#a78bfa','#22d3ee','#fb923c','#f472b6','#94a3b8'];
let S=null;
try{S=JSON.parse(localStorage.getItem('mcf2'))}catch(e){}
S=S||{mov:[],goals:[],cur:'Bs',cats:{i:['Trabajo','Ventas','Regalo','Otros'],g:['Comida','Transporte','Estudios','Ocio','Salud','Otros']}};
const save=()=>{try{localStorage.setItem('mcf2',JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fm=n=>S.cur+' '+n.toLocaleString('es-BO',{minimumFractionDigits:2,maximumFractionDigits:2});
const fd=d=>new Date(d).toLocaleString('es-BO',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
const nowLocal=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)};
const sum=(a,t)=>a.filter(m=>m.t===t).reduce((s,m)=>s+m.m,0);
const ap=()=>S.goals.filter(g=>g.st!=='paid').reduce((s,g)=>s+(g.ap||0),0);
const spent=()=>S.goals.filter(g=>g.st==='paid').reduce((s,g)=>s+(g.ap||0),0)+S.log.filter(l=>l.st==='paid').reduce((s,l)=>s+(l.ap||0),0);
const avail=()=>sum(S.mov,'i')-sum(S.mov,'g')-ap()-spent();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function toast(t){const e=$('#toast');e.textContent=t;e.className='s';clearTimeout(toast.t);toast.t=setTimeout(()=>e.className='',2200)}

const DUR={w:'Semanal',q:'15 días',m:'1 mes',u:'Único'},STL={act:'En curso',done:'Lograda',paid:'Pagada ✓',exp:'No lograda'};
const ymd=d=>{const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10)};
const today=()=>ymd(new Date()),pd=s=>new Date(s+'T00:00:00');
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
const fs=s=>pd(s).toLocaleDateString('es-BO',{weekday:'short',day:'numeric',month:'short'});
const fr=(a,b)=>b>'9000'?'desde '+fs(a):fs(a)+' – '+fs(b);
const gst=g=>g.st==='act'&&g.s>=g.t?'done':g.st;
const mend=s=>{const d=pd(s),last=new Date(d.getFullYear(),d.getMonth()+2,0).getDate(),e=new Date(d.getFullYear(),d.getMonth()+1,Math.min(d.getDate(),last));e.setDate(e.getDate()-1);return ymd(e)};
function period(dur){
  const t=today();
  if(dur==='w'){const s=addD(t,-((pd(t).getDay()+6)%7));return{start:s,end:addD(s,6)}}
  if(dur==='q')return{start:t,end:addD(t,14)};
  if(dur==='u')return{start:t,end:'9999-12-31'};
  return{start:t,end:mend(t)};
}
function fix(){S.log=S.log||[];S.aps=S.aps||[];S.goals.forEach(g=>{if(!g.end)Object.assign(g,{dur:'m',st:'act'},period('m'))})}
function roll(){
  const t=today();let ch=0;
  S.goals=S.goals.map(g=>{
    if(g.dur==='u'||t<=g.end)return g;
    ch=1;S.log.push({...g,st:g.st==='paid'?'paid':(g.s>=g.t?'done':'exp')});
    const n={...g,s:0,ap:0,st:'act',paid:null,id:uid()};
    if(g.dur==='w')return{...n,...period('w')};
    const nx=s=>g.dur==='q'?addD(s,14):mend(s);
    let s=addD(g.end,1),e=nx(s);
    while(e<t){s=addD(e,1);e=nx(s)}
    return{...n,start:s,end:e};
  });
  if(ch)save();
}
fix();
let tab='home',type='g',filt='all',q='';
const TABS=[['home','⌂','Inicio'],['add','+','Registrar'],['hist','▤','Historial'],['set','⚙','Ajustes']];
function go(t,ty){tab=t;if(ty)type=ty;render();scrollTo(0,0)}
function render(){
  roll();
  $('#nav').innerHTML=TABS.map(([k,i,l])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')"><span>${i}</span>${l}</button>`).join('');
  $('#v').innerHTML={home,add,hist,set}[tab]();
  if(tab==='add')$('#amt').focus({preventScroll:true});
}

/* ---------- INICIO ---------- */
function home(){
  const I=sum(S.mov,'i'),G=sum(S.mov,'g'),now=new Date();
  const mes=S.mov.filter(m=>{const d=new Date(m.d);return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear()});
  // dona de gastos del mes
  const by={};mes.filter(m=>m.t==='g').forEach(m=>by[m.c]=(by[m.c]||0)+m.m);
  const ent=Object.entries(by).sort((a,b)=>b[1]-a[1]),tg=ent.reduce((s,e)=>s+e[1],0);
  let off=0;const R=54,C=2*Math.PI*R;
  const arcs=ent.map(([c,v],i)=>{const l=v/tg*C,s=`<circle cx="75" cy="75" r="${R}" fill="none" stroke="${COL[i%COL.length]}" stroke-width="22" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}" transform="rotate(-90 75 75)"/>`;off+=l;return s}).join('');
  const donut=ent.length?`<div class="donut"><svg viewBox="0 0 150 150" role="img" aria-label="Gastos por categoría"><circle cx="75" cy="75" r="${R}" fill="none" stroke="#1b2a43" stroke-width="22"/>${arcs}<text x="75" y="72" text-anchor="middle" fill="#8ea2c4" font-size="10">Gastado</text><text x="75" y="90" text-anchor="middle" fill="#fff" font-size="14" font-weight="800">${tg.toLocaleString('es-BO',{maximumFractionDigits:0})}</text></svg><div class="lg">${ent.slice(0,6).map(([c,v],i)=>`<div><s style="background:${COL[i%COL.length]}"></s>${esc(c)}<span>${Math.round(v/tg*100)}%</span></div>`).join('')}</div></div>`:`<div class="empty">Aún no hay gastos este mes.</div>`;
  // barras 7 días
  const ds=[...Array(7)].map((_,k)=>{const d=new Date();d.setDate(d.getDate()-6+k);return d});
  const dd=ds.map(d=>{const mv=S.mov.filter(m=>new Date(m.d).toDateString()===d.toDateString());return{l:d.toLocaleDateString('es-BO',{weekday:'short'}).slice(0,3),i:sum(mv,'i'),g:sum(mv,'g')}});
  const mx=Math.max(1,...dd.flatMap(x=>[x.i,x.g]));
  const bars=`<div class="days">${dd.map(x=>`<div><u><i style="height:${x.i/mx*100}%;background:var(--gr)" title="Ingresos ${fm(x.i)}"></i><i style="height:${x.g/mx*100}%;background:var(--rd)" title="Gastos ${fm(x.g)}"></i></u>${x.l}</div>`).join('')}</div>`;
  const dg=S.goals.filter(g=>g.st!=='paid'),dS=dg.reduce((s,g)=>s+g.s,0),dT=dg.reduce((s,g)=>s+g.t,0),dF=Math.max(0,dT-dS),dP=dT?Math.min(100,dS/dT*100):0;
  return `
  <div class="top"><div class="card hero"><small>Dinero disponible</small><div class="big">${fm(avail())}</div>
    <div class="two"><div class="mini"><small>↗ Ingresos totales</small><b class="in">${fm(I)}</b></div><div class="mini"><small>↘ Gastos totales</small><b class="out">${fm(G)}</b></div></div></div>
  <div class="card hero debt"><small>Saldo para deudas</small><div class="big">${fm(dS)}</div>
    <div class="two"><div class="mini"><small>◎ Total de mis metas</small><b>${fm(dT)}</b></div><div class="mini"><small>⏳ Me falta juntar</small><b class="out">${fm(dF)}</b></div></div>
    <div class="bar" style="margin:14px 0 0"><i style="width:${dP}%"></i></div></div></div>
  <h2>ACCIONES RÁPIDAS</h2>
  <div class="acts"><button class="act a" onclick="go('add','i')"><i>+</i>Agregar ingreso</button><button class="act b" onclick="go('add','g')"><i>−</i>Agregar gasto</button></div>
  <h2>MIS METAS<button onclick="newGoal()">+ Nueva meta</button></h2>
  ${S.goals.length?`<div class="grid gg">${S.goals.map(goalCard).join('')}</div>`:`<div class="empty">Crea tu primera meta y ve cuánto te falta para lograrla.</div>`}
  <h2>RESUMEN DEL MES</h2>
  <div class="cols"><div class="card"><b style="font-size:14px">Gastos por categoría</b><div style="margin-top:14px">${donut}</div></div>
  <div class="card" style="margin-top:12px"><b style="font-size:14px">Últimos 7 días</b><div style="margin:14px 0 4px">${bars}</div><div class="gf" style="justify-content:center;gap:16px"><span class="in">● Ingresos</span><span class="out">● Gastos</span></div></div></div>
  <h2>ÚLTIMOS MOVIMIENTOS<button onclick="go('hist')">Ver todo</button></h2>
  <div class="card">${S.mov.length?[...S.mov].sort((a,b)=>b.d.localeCompare(a.d)).slice(0,5).map(mvRow).join(''):'<div class="empty" style="border:0">Todavía no registraste movimientos.</div>'}</div>`;
}
function goalCard(g){
  const p=Math.min(100,g.s/g.t*100),f=Math.max(0,g.t-g.s),st=gst(g),left=Math.round((pd(g.end)-pd(today()))/864e5)+1;
  return `<div class="card goal"><div class="gh"><b style="color:#fff">${esc(g.n)}</b><span>${fm(g.s)} de ${fm(g.t)}</span></div>
  <div class="gf" style="margin-top:4px"><span>${DUR[g.dur]} · ${fr(g.start,g.end)}</span><span>${g.dur==='u'?'Sin fecha límite':left===1?'Termina hoy':'Quedan '+left+' días'}</span></div>
  <div class="bar"><i style="width:${p}%"></i></div>
  <div class="gf"><span>${p.toFixed(0)}% completado</span><span>${st==='paid'?'Pagada ✓':f>0?'Faltan '+fm(f):'¡Meta lograda! 🎉'}</span></div>
  <div class="gb">${st==='paid'?'':st==='done'?`<button class="btn p" onclick="payGoal('${g.id}')">✓ Marcar como pagada</button>`:`<button class="btn p" onclick="addToGoal('${g.id}')">+ Aportar</button>`}${st==='paid'?'':`<button class="btn d" onclick="delGoal('${g.id}')">Eliminar</button>`}</div></div>`;
}
function mvRow(m,del){
  const i=m.t==='i';
  return `<div class="mv"><div class="ic" style="background:${i?'#12402f':'#4a2330'};color:${i?'var(--gr)':'var(--rd)'}">${i?'↗':'↘'}</div>
  <div class="t"><b>${esc(m.c)}</b><small>${m.n?esc(m.n)+' · ':''}${fd(m.d)}</small></div>
  <div class="am ${i?'in':'out'}">${i?'+':'−'}${fm(m.m)}</div>${del?`<button class="x" onclick="delMov('${m.id}')" aria-label="Eliminar">✕</button>`:''}</div>`;
}

/* ---------- REGISTRAR ---------- */
function add(){
  return `<h2 style="margin-top:6px">NUEVO MOVIMIENTO</h2><form class="card" onsubmit="saveMov(event)">
  <div class="seg"><button type="button" class="${type==='i'?'on i':''}" onclick="type='i';render()">↗ Ingreso</button><button type="button" class="${type==='g'?'on g':''}" onclick="type='g';render()">↘ Gasto</button></div>
  <label for="amt">Monto (${esc(S.cur)})</label><input id="amt" class="amt" type="number" inputmode="decimal" step="0.01" min="0.01" placeholder="0,00" required>
  <label for="cat">Categoría</label><select id="cat">${S.cats[type].map(c=>`<option>${esc(c)}</option>`).join('')}</select>
  <label for="nt">Nota (opcional)</label><input id="nt" maxlength="60" placeholder="Ej: almuerzo, pasajes…">
  <label for="dt">Fecha y hora</label><input id="dt" type="datetime-local" value="${nowLocal()}" required>
  <button class="btn p" style="width:100%;margin-top:20px;padding:14px;font-size:16px">Guardar ${type==='i'?'ingreso':'gasto'}</button></form>`;
}
function saveMov(e){
  e.preventDefault();
  const m=parseFloat($('#amt').value);if(!(m>0))return toast('Escribe un monto válido');
  S.mov.push({id:uid(),t:type,m,c:$('#cat').value,n:$('#nt').value.trim(),d:new Date($('#dt').value).toISOString()});
  save();toast('Movimiento guardado ✓');go('home');
}
function delMov(id){if(confirm('¿Eliminar este movimiento?')){S.mov=S.mov.filter(m=>m.id!==id);save();render()}}

/* ---------- HISTORIAL ---------- */
function filtered(){
  return S.mov.filter(m=>(filt==='all'||m.t===filt)&&(!q||(m.c+' '+m.n).toLowerCase().includes(q.toLowerCase()))).sort((a,b)=>b.d.localeCompare(a.d));
}
function hist(){
  const L=filtered(),I=sum(L,'i'),G=sum(L,'g');
  return `<h2 style="margin-top:6px">HISTORIAL<button onclick="pdf()">⬇ Descargar PDF</button></h2>
  <div class="seg" style="margin-bottom:12px;grid-template-columns:repeat(4,1fr)">${[['all','Todos','t'],['i','Ingresos','i'],['g','Gastos','g'],['m','Metas','t']].map(([k,l,c])=>`<button class="${filt===k?'on '+c:''}" style="grid-column:auto" onclick="filt='${k}';render()">${l}</button>`).join('')}</div>
  <input placeholder="🔍 Buscar por categoría o nota" value="${esc(q)}" oninput="q=this.value;list()" style="margin-bottom:12px">
  <div class="card"><div class="two" style="margin-bottom:6px"><div><small style="color:var(--mu)">Ingresos</small><br><b class="in">${fm(I)}</b></div><div><small style="color:var(--mu)">Gastos</small><br><b class="out">${fm(G)}</b></div></div><div id="lst">${lstHtml()}</div></div>`;
}
const goalsF=()=>filt==='i'||filt==='g'?[]:[...S.goals,...S.log].filter(g=>!q||g.n.toLowerCase().includes(q.toLowerCase())).sort((a,b)=>b.start.localeCompare(a.start));
function goalRow(g){
  const p=Math.min(100,g.s/g.t*100),st=gst(g);
  return `<div class="mv"><div class="ic" style="background:#1b3a66;color:#8fb4ff">◎</div><div class="t"><b>${esc(g.n)}</b><small>${DUR[g.dur]} · ${fr(g.start,g.end)} · ${p.toFixed(0)}%</small></div><div class="am ${st==='paid'?'in':st==='exp'?'out':''}" style="font-size:12.5px;text-align:right">${STL[st]}<br><span style="color:var(--mu);font-weight:600">${fm(g.s)} / ${fm(g.t)}</span></div></div>`;
}
const apsF=()=>filt==='i'||filt==='g'?[]:S.aps.filter(a=>!q||a.n.toLowerCase().includes(q.toLowerCase())).sort((a,b)=>b.d.localeCompare(a.d));
const apRow=a=>`<div class="mv"><div class="ic" style="background:#1b3a66;color:#8fb4ff">◎</div><div class="t"><b>Aporte a meta</b><small>${esc(a.n)} · ${fd(a.d)}</small></div><div class="am" style="color:#8fb4ff">−${fm(a.m)}</div></div>`;
function lstHtml(){
  const L=filtered(),GL=goalsF(),AP=apsF(),sub=t=>`<div class="gf" style="margin:14px 0 2px">${t}</div>`;
  if(!L.length&&!GL.length&&!AP.length)return '<div class="empty" style="border:0">No hay nada para mostrar.</div>';
  return L.map(m=>mvRow(m,1)).join('')+(AP.length?sub('Aportes a metas')+AP.map(apRow).join(''):'')+(GL.length?sub('Metas')+GL.map(goalRow).join(''):'');
}
function list(){$('#lst').innerHTML=lstHtml()}
function pdf(){
  const L=filtered(),GL=goalsF(),AP=apsF();if(!L.length&&!GL.length&&!AP.length)return toast('No hay nada para exportar');
  if(!window.jspdf)return toast('No se pudo cargar el generador de PDF. Revisa tu conexión.');
  const doc=new window.jspdf.jsPDF(),I=sum(L,'i'),G=sum(L,'g'),n=x=>x.toLocaleString('es-BO',{minimumFractionDigits:2,maximumFractionDigits:2});
  doc.setFontSize(18);doc.text('Semilla',14,18);
  doc.setFontSize(10);doc.setTextColor(110);
  doc.text('Historial de '+({all:'movimientos y metas',i:'ingresos',g:'gastos',m:'metas'})[filt]+' · generado el '+fd(new Date()),14,25);
  doc.setTextColor(0);let y=32;
  if(L.length){
    doc.text(`Ingresos: ${S.cur} ${n(I)}   Gastos: ${S.cur} ${n(G)}   Balance: ${S.cur} ${n(I-G)}`,14,32);
    doc.autoTable({startY:37,head:[['Fecha','Tipo','Categoría','Nota','Monto ('+S.cur+')']],
      body:L.map(m=>[fd(m.d),m.t==='i'?'Ingreso':'Gasto',m.c,m.n,(m.t==='i'?'+':'-')+n(m.m)]),
      headStyles:{fillColor:[23,160,104]},styles:{fontSize:9},columnStyles:{4:{halign:'right'}},
      didParseCell:h=>{if(h.section==='body'&&h.column.index===4)h.cell.styles.textColor=h.row.raw[1]==='Ingreso'?[23,140,90]:[210,60,80]}});
    y=doc.lastAutoTable.finalY+12;
  }
  if(AP.length){
    doc.setFontSize(12);doc.text('Aportes a metas',14,y);
    doc.autoTable({startY:y+4,head:[['Fecha','Meta','Monto ('+S.cur+')']],body:AP.map(a=>[fd(a.d),a.n,n(a.m)]),headStyles:{fillColor:[23,160,104]},styles:{fontSize:9},columnStyles:{2:{halign:'right'}}});
    y=doc.lastAutoTable.finalY+12;
  }
  if(GL.length){
    doc.setFontSize(12);doc.text('Metas',14,y);
    doc.autoTable({startY:y+4,head:[['Meta','Duración','Periodo','Avance','Estado']],
      body:GL.map(g=>[g.n,DUR[g.dur],fr(g.start,g.end),`${S.cur} ${n(g.s)} / ${n(g.t)} (${Math.round(Math.min(100,g.s/g.t*100))}%)`,STL[gst(g)].replace(' ✓','')]),
      headStyles:{fillColor:[23,160,104]},styles:{fontSize:9}});
  }
  doc.save('historial-'+new Date().toISOString().slice(0,10)+'.pdf');toast('PDF descargado ✓');
}

/* ---------- AJUSTES ---------- */
function set(){
  const cs=t=>`<div class="chips">${S.cats[t].map(c=>`<span class="chip">${esc(c)}<button onclick="delCat('${t}',${S.cats[t].indexOf(c)})" aria-label="Quitar ${esc(c)}">✕</button></span>`).join('')}</div>
  <div class="row" style="margin-top:12px"><input id="nc${t}" maxlength="24" placeholder="Nueva categoría" onkeydown="if(event.key==='Enter')addCat('${t}')"><button class="btn p" onclick="addCat('${t}')">Agregar</button></div>`;
  return `<h2 style="margin-top:6px">CATEGORÍAS</h2><div class="cols">
  <div class="card"><b class="in">Ingresos</b><div style="margin-top:12px">${cs('i')}</div></div>
  <div class="card" style="margin-top:12px"><b class="out">Gastos</b><div style="margin-top:12px">${cs('g')}</div></div></div>
  <h2>MONEDA</h2><div class="card"><div class="row"><input id="cur" value="${esc(S.cur)}" maxlength="5"><button class="btn p" onclick="S.cur=($('#cur').value.trim()||'Bs');save();toast('Moneda actualizada ✓')">Guardar</button></div></div>
  <h2>TUS DATOS</h2><div class="card"><p style="font-size:13px;color:var(--mu);margin-bottom:12px">Tus datos se guardan solo en este dispositivo. Haz una copia para pasarlos de tu laptop al celular.</p>
  <div class="row" style="flex-wrap:wrap"><button class="btn" onclick="backup()">⬇ Descargar copia</button><button class="btn" onclick="$('#imp').click()">⬆ Restaurar copia</button><button class="btn d" onclick="reset()">Borrar todo</button></div>
  <input id="imp" type="file" accept=".json" hidden onchange="restore(this.files[0])"></div>`;
}
function addCat(t){const v=$('#nc'+t).value.trim();if(!v)return;if(S.cats[t].some(c=>c.toLowerCase()===v.toLowerCase()))return toast('Esa categoría ya existe');S.cats[t].push(v);save();render()}
function delCat(t,i){if(S.cats[t].length<2)return toast('Debe quedar al menos una categoría');S.cats[t].splice(i,1);save();render()}
function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='copia-semilla.json';a.click()}
function restore(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.mov||!d.cats)throw 0;S=d;fix();save();toast('Copia restaurada ✓');render()}catch(e){toast('El archivo no es válido')}};r.readAsText(f)}
function reset(){if(confirm('Esto borrará todos tus movimientos y metas. ¿Continuar?')){S.mov=[];S.goals=[];S.log=[];S.aps=[];save();render()}}

/* ---------- METAS ---------- */
function modal(title,fields,ok,cb){
  $('#df').innerHTML=`<h3 style="margin-bottom:4px">${title}</h3>${fields.map(f=>`<label>${f.l}${f.o?`<select name="${f.k}" style="margin-top:6px">${f.o.map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select>`:`<input name="${f.k}" type="${f.t||'text'}" ${f.t==='number'?'step="0.01" min="0.01" inputmode="decimal"':'maxlength="40"'} required style="margin-top:6px">`}</label>`).join('')}
  <div class="row" style="margin-top:18px"><button type="button" class="btn" onclick="$('#dlg').close()">Cancelar</button><button class="btn p" style="flex:1">${ok}</button></div>`;
  $('#df').onsubmit=e=>{e.preventDefault();cb(Object.fromEntries(new FormData(e.target)));$('#dlg').close()};
  $('#dlg').showModal();
}
function newGoal(){
  modal('Nueva meta',[{k:'n',l:'¿Qué quieres lograr?'},{k:'t',l:'Monto objetivo',t:'number'},
    {k:'dur',l:'Duración',o:[['w','Semanal (lunes a domingo, se repite)'],['q','15 días (se repite)'],['m','1 mes (se repite)'],['u','Único (se elimina al pagar)']]},
    {k:'s',l:'¿Cuánto llevas ahorrado? (puede ser 0)',t:'number'}],'Crear meta',v=>{
    const p=period(v.dur);S.goals.push({id:uid(),n:v.n.trim(),t:parseFloat(v.t),s:Math.max(0,parseFloat(v.s)||0),dur:v.dur,...p,st:'act'});save();toast('Meta creada ✓');render()});
  $('#df [name=s]').removeAttribute('required');$('#df [name=s]').min=0}
function addToGoal(id){const g=S.goals.find(x=>x.id===id);modal('Aportar a «'+esc(g.n)+'»',[{k:'m',l:'Monto a aportar',t:'number'}],'Aportar',v=>{
  const m=Math.min(parseFloat(v.m),g.t-g.s);if(!(m>0))return;if(m>avail())return toast('No tienes tanto dinero disponible ('+fm(avail())+')');
  g.s+=m;g.ap=(g.ap||0)+m;S.aps.push({id:uid(),gid:g.id,n:g.n,m,d:new Date().toISOString()});save();toast(g.s>=g.t?'¡Meta lograda! Ya puedes marcarla como pagada 🎉':'Aporte guardado ✓');render()})}
function payGoal(id){
  const g=S.goals.find(x=>x.id===id),u=g.dur==='u';
  if(!confirm('¿Marcar «'+g.n+'» como pagada? El dinero apartado se descuenta definitivamente.'+(u?' La meta se quitará de tu lista y quedará en el Historial.':'')))return;
  g.st='paid';g.paid=today();
  if(u){S.log.push({...g});S.goals=S.goals.filter(x=>x.id!==id)}
  save();toast(u?'Meta pagada y eliminada ✓':'Meta pagada ✓');render();
}
function delGoal(id){if(confirm('¿Eliminar esta meta?')){S.goals=S.goals.filter(g=>g.id!==id);save();render()}}

render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
